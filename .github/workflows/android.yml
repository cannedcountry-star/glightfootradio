name: Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # 署名鍵 (Secrets) があれば毎回同じ鍵で署名する → アプリを消さずに上書き更新できる
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::署名鍵 (KEYSTORE_BASE64) が未設定のため debug 鍵で署名します。更新時はアンインストールが必要です。"
          fi

      - name: Build APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "GLightfootRadio-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: GLightfootRadio-1.0.${{ github.run_number }}
          path: GLightfootRadio-*.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" "GLightfootRadio-1.0.${{ github.run_number }}.apk" \
            --target "${{ github.sha }}" \
            --title "Gordon Lightfoot Radio 1.0.${{ github.run_number }}" \
            --notes "Android 用 APK。スマホでこのページを開き、APK をダウンロードしてインストールしてください。" \
            --latest
